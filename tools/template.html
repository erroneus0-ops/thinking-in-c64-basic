<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>$title$</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --paper: #f7f8fb;
  --ink: #1d2142;
  --muted: #5a5f80;
  --rule: #d7d9e6;
  --accent: #40318d;        /* C64 blue */
  --tint: #ebe9f8;
  --screen: #40318d;        /* C64 screen blue */
  --screen-text: #c4bdf7;   /* brightened C64 light blue, for legibility */
  --screen-frame: #7869c4;  /* C64 light blue border */
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #17162a; --ink: #e6e4f6; --muted: #a9a6c9; --rule: #34325a;
    --accent: #a99ff0; --tint: #26244a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #17162a; --ink: #e6e4f6; --muted: #a9a6c9; --rule: #34325a;
  --accent: #a99ff0; --tint: #26244a;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 1.125rem/1.6 "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
main { max-width: 38rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

.edition { color: var(--muted); font-size: 0.875rem; margin: 0 0 2.5rem; }
.book-title { font-weight: 700; font-size: 2.6rem; line-height: 1.05; margin: 0 0 0.4rem; letter-spacing: -0.02em; }

.tour-link { margin: 0.75rem 0 1.75rem; }
.tour-link a { display: block; padding: 0.7rem 0.9rem; border-radius: 8px; background: var(--tint);
  color: var(--ink); text-decoration: none; border-left: 4px solid var(--accent); }
.tour-link span { color: var(--accent); font-weight: 700; white-space: nowrap; }
details.toc { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 0.6rem 0; margin-bottom: 3rem; }
details.toc summary { cursor: pointer; font-weight: 700; }
details.toc ul { padding-left: 1.1rem; margin: 0.5rem 0 0; }
details.toc li { margin: 0.2rem 0; }
details.toc ul ul { font-size: 0.95rem; }

h1 { font-size: 2rem; line-height: 1.15; margin: 4rem 0 1rem; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; line-height: 1.25; margin: 2.75rem 0 0.75rem; padding-top: 1rem; border-top: 3px solid var(--accent); }
p, ul, ol { margin: 0 0 1rem; }
li { margin: 0.25rem 0; }
a { color: var(--accent); }
a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
strong { font-weight: 700; }

/* Code typed into the C64 looks like the C64 screen */
pre {
  background: var(--screen);
  color: var(--screen-text);
  border: 0.75rem solid var(--screen-frame);
  border-radius: 4px;
  padding: 0.9rem 1rem;
  margin: 0 0 1.25rem;
  overflow-x: auto;
  font: 600 0.95rem/1.45 "IBM Plex Mono", Consolas, "Courier New", monospace;
}
/* A RETURN keycap after each line to type: press RETURN (Enter) at the end of every line */
pre code .ln::after { content: "\21B5"; display: inline-block; margin-left: 0.6em; padding: 0 0.3em;
  font: 400 0.9em/1.15 "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols", "Arial Unicode MS", sans-serif;
  border: 1px solid currentColor; border-radius: 3px; opacity: 0.75; vertical-align: 0.05em; }
/* Diagrams are pictures, not something to type */
/* Code must never be reshaped: no ligatures (an IJ ligature once made "GHIJKL" read as "GHUKL"). */
pre, code { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0, "dlig" 0; }
/* Reference blocks that are read, not typed: syntax, variables used, and the C64's output */
pre.syntax, pre.vars { background: var(--tint); color: var(--ink); border: 1.5px solid var(--rule); font-weight: 500; }
pre.vars { border-style: dashed; }
pre.output { border-color: var(--screen); border-width: 0.4rem; position: relative; padding-top: 1.6rem; }
pre.output::before { content: "Output"; position: absolute; top: 0.35rem; left: 0.9rem; font: 700 0.7rem "Atkinson Hyperlegible", sans-serif;
  letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7; }
pre.diagram { background: var(--tint); color: var(--ink); border: 2px dashed var(--rule); font-weight: 500; }
pre code { font: inherit; background: none; padding: 0; color: inherit; white-space: pre; }  /* never wrap a line of code: it would look like two lines */
code { white-space: pre-wrap; font: 500 0.92em "IBM Plex Mono", Consolas, monospace; background: var(--tint); padding: 0.05em 0.3em; border-radius: 3px; }

/* "Good to know" boxes: optional clarifying details, safe to skip on a first read */
/* Chapters still in testing: amber, so it's obvious they may change */
:root { --testing: #b45309; --testing-tint: #fff4e0; }
@media (prefers-color-scheme: dark) { :root { --testing: #f0b35a; --testing-tint: #2e2414; } }
div.testing { border-left: 5px solid var(--testing); padding-left: 1.25rem; }
div.testing-banner { background: var(--testing-tint); border: 1.5px solid var(--testing); border-radius: 8px;
  padding: 0.75rem 1rem; margin: 0 0 1.5rem; }
div.testing-banner::before { content: "In testing"; display: block; font-weight: 700; color: var(--testing); margin-bottom: 0.25rem; }
div.testing-banner > :last-child { margin-bottom: 0; }
.badge { display: inline-block; font-size: 0.5em; font-weight: 700; vertical-align: middle; letter-spacing: 0.02em;
  padding: 0.15em 0.6em; border-radius: 999px; background: var(--testing); color: #fff; }
@media (prefers-color-scheme: dark) { .badge { color: #2e2414; } }
div.good-to-know { border-left: 4px solid var(--accent); background: var(--tint);
  padding: 0.75rem 1rem; margin: 0 0 1.25rem; border-radius: 0 6px 6px 0; }
div.good-to-know::before { content: "Good to know"; display: block; font-weight: 700;
  color: var(--accent); margin-bottom: 0.25rem; }
div.good-to-know > :last-child { margin-bottom: 0; }
table { display: block; overflow-x: auto; border-collapse: collapse; margin: 0 0 1.25rem; font-size: 1rem; max-width: 100%; }
th, td { text-align: left; vertical-align: top; padding: 0.45rem 0.75rem 0.45rem 0; border-bottom: 1px solid var(--rule); }
th { border-bottom: 2px solid var(--ink); }

@media print {
  :root { --paper: #fff; --ink: #000; --muted: #444; --rule: #bbb; --accent: #40318d; --tint: #eee; }
  details.toc, .tour-link { display: none; }
  h1 { break-before: page; margin-top: 0; }
  pre, table { break-inside: avoid; }
  pre { font-size: 0.78rem; }   /* the page can't scroll, so make long lines fit */
}
@page { size: letter; margin: 2cm 2cm 2.2cm; }
</style>
</head>
<body>
<main>
<p class="edition">$edition$, built $date$</p>
<p class="book-title">$title$</p>
$if(tourhref)$
<p class="tour-link"><a href="$tourhref$">New to the Commodore 64 and the emulator? <span>Take the quick tour →</span></a></p>
$endif$
<details class="toc">
<summary>Contents</summary>
$toc$
</details>
$body$
</main>
</body>
</html>
