<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Thinking in C64 BASIC</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  main { max-width: 26rem; margin: 0 auto; padding: 4rem 1.25rem; }
  h1 { font-size: 1.8rem; margin: 0 0 0.4rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  label { display: block; font-weight: 700; margin-bottom: 0.4rem; }
  input { font: inherit; width: 100%; padding: 0.55rem 0.7rem; border-radius: 6px;
    border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); }
  input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button { margin-top: 1rem; }
  #msg { min-height: 1.5rem; margin-top: 1rem; color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Thinking in C64 BASIC</h1>
  <p>Type your name to start. Use the same name on any computer or phone, and your work follows you.</p>
  <form id="f">
    <label for="name">Your name</label>
    <input id="name" autocomplete="nickname" maxlength="30" required autofocus>
    <button class="primary" type="submit">Start</button>
    <div id="msg" role="status"></div>
  </form>
</main>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: document.getElementById('name').value }) });
  const out = await res.json();
  if (!res.ok) { document.getElementById('msg').textContent = out.error || 'That didn’t work.'; return; }
  const next = new URLSearchParams(location.search).get('next');
  location.href = next && next.startsWith('/') ? next : '/';
};
</script>
</body>
</html>
