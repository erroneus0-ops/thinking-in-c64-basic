<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Thinking in C64 BASIC (editor’s edition)</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --paper: #f7f8fb; --ink: #1d2142; --muted: #5a5f80; --rule: #d7d9e6;
  --accent: #40318d; --accent-ink: #ffffff; --bad: #b3261e;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #17162a; --ink: #e6e4f6; --muted: #a9a6c9; --rule: #34325a;
    --accent: #a99ff0; --accent-ink: #17162a; --bad: #ff8a80;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #17162a; --ink: #e6e4f6; --muted: #a9a6c9; --rule: #34325a;
  --accent: #a99ff0; --accent-ink: #17162a; --bad: #ff8a80;
}
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink);
  font: 1.0625rem/1.55 "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; }
main { max-width: 26rem; margin: 0 auto; padding: 4rem 1.25rem; }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 0.4rem; }
p { color: var(--muted); margin: 0 0 1.75rem; }
label { display: block; font-weight: 700; margin-bottom: 0.4rem; }
input { font: inherit; width: 100%; padding: 0.55rem 0.7rem; border-radius: 6px;
  border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); }
button { font: inherit; font-weight: 700; margin-top: 1rem; padding: 0.55rem 1.2rem; border-radius: 6px;
  border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button:disabled { opacity: 0.6; cursor: default; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#msg { min-height: 1.5rem; margin-top: 1rem; color: var(--bad); }
.hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Thinking in C64 BASIC</h1>
  <p>Editor’s edition. Enter the password to open it.</p>
  <form id="unlock" autocomplete="on">
    <input class="hidden" type="text" name="username" value="editor" autocomplete="username" readonly>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Open</button>
    <div id="msg" role="status"></div>
  </form>
</main>
